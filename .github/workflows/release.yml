name: Release

# Builds and publishes real, installable HiddenSteps binaries — the thing
# README.md's old "Status" section said didn't exist yet. Triggered by
# pushing a `v*.*.*` tag (or manually via workflow_dispatch for a dry run).
#
# Signing/notarization are NOT configured (no Apple Developer / code-signing
# certificates available) — builds are real and installable but unsigned.
# macOS users will need to right-click → Open (or `xattr -d
# com.apple.quarantine`) past Gatekeeper the first time; Windows may show an
# unrecognized-publisher SmartScreen prompt. This is disclosed in the release
# notes, not hidden.
#
# To enable signing, a maintainer must supply the certificates as repo secrets
# and the tauri-action step below picks them up automatically (see
# https://tauri.app/distribute/sign/):
#   - macOS:   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#              APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific),
#              APPLE_TEAM_ID  — enables Developer-ID signing + notarization.
#   - Windows: a code-signing cert configured via tauri.conf.json's
#              bundle.windows.certificateThumbprint (or an Azure Trusted
#              Signing / SignPath integration).
# Until those exist, the checksums + SBOM steps below are the integrity story.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      # Third-party actions pinned by commit SHA (version in the comment) so a
      # compromised upstream tag can't repoint to malicious code in a workflow
      # that has contents:write and publishes release binaries.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl wget file patchelf

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable @ 2024

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/desktop/src-tauri

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: apps/desktop/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop/ui
        run: npm ci

      - uses: tauri-apps/tauri-action@1ddc7b49b13c3038297360482fcb3e058764d7c9 # v0.6.2
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "HiddenSteps ${{ github.ref_name }}"
          releaseBody: |
            Early, unsigned build — see the repo README for current status and the honest list of what does and doesn't work yet.

            **Verify your download** against the attached `SHA256SUMS-<os>.txt` for your platform, e.g. `sha256sum -c SHA256SUMS-Linux.txt`. An SBOM (`sbom.spdx.json`) listing the Rust dependencies compiled into the build is attached too.

            These builds are **unsigned** (no code-signing certificates are configured yet), so:

            - **macOS**: Gatekeeper will block an unsigned app. Right-click the app → Open, or `xattr -d com.apple.quarantine /path/to/HiddenSteps.app`.
            - **Windows**: SmartScreen may warn about an unrecognized publisher. Click "More info" → "Run anyway".
            - **Linux**: the AppImage should just run (`chmod +x` it first).
          releaseDraft: true
          prerelease: true

      # Integrity + provenance for the artifacts. Real code-signing /
      # notarization still needs certificates a maintainer must supply (see
      # the note at the top of this file); until then, published checksums and
      # an SBOM at least let a downloader verify a build wasn't tampered with in
      # transit and see exactly what went into it. Tag builds only — a manual
      # workflow_dispatch dry-run has no release to attach to.
      - name: Generate SHA-256 checksums for the built artifacts
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          sums="SHA256SUMS-${{ runner.os }}.txt"
          : > "$sums"
          echo '${{ steps.tauri.outputs.artifactPaths }}' | jq -r '.[]' | while read -r artifact; do
            [ -f "$artifact" ] || continue
            if command -v sha256sum >/dev/null 2>&1; then
              (cd "$(dirname "$artifact")" && sha256sum "$(basename "$artifact")") >> "$GITHUB_WORKSPACE/$sums"
            else
              (cd "$(dirname "$artifact")" && shasum -a 256 "$(basename "$artifact")") >> "$GITHUB_WORKSPACE/$sums"
            fi
          done
          cat "$sums"

      - name: Generate an SBOM (Linux only — one is enough for all platforms)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-sbom --locked
          (cd apps/desktop/src-tauri && cargo sbom) > sbom.spdx.json

      - name: Attach checksums and SBOM to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          files=("SHA256SUMS-${{ runner.os }}.txt")
          [ -f sbom.spdx.json ] && files+=("sbom.spdx.json")
          gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber --repo "${{ github.repository }}"
