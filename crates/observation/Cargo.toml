[package]
name = "hiddensteps-observation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hiddensteps-domain = { path = "../domain" }
thiserror.workspace = true
# Cross-platform screenshot capture for the Level-4 (Deep-mode) `ScreenshotSource`
# (`src/screenshot.rs`) — one implementation for Linux/macOS/Windows rather than
# three hand-rolled per-OS backends. `default-features = false` because xcap's
# own optional "image" feature only turns on `image`'s *default* codec set
# (including heavyweight AVIF encoding via `ravif`/`rav1e`) — this source only
# ever needs PNG, which `xcap`'s own mandatory `image` dependency already
# provides unconditionally.
xcap = { version = "0.9", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14"
notify = "8"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }
notify = "8"

[dev-dependencies]
tempfile = "3"
